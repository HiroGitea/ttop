[package]
name = "ttop"
version = "0.1.0"
edition = "2021"
description = "Interactive top-like monitor for Google Cloud TPU (like jtop / btop)"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost", "channel"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rand = "0.8"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
